name: Fetch Quota & Notify
# 每 5 分钟自动抓取配额并通知

on:
  workflow_dispatch:
  repository_dispatch:
    types: [fetch-quota]

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests cryptography

      - name: Fetch quota & notify
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_SUBSCRIBERS: ${{ secrets.EMAIL_SUBSCRIBERS }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: python ci_run.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ state.json notify_state.json notify_log.json 2>/dev/null || true
          for i in 1 2 3 4 5; do
            if ! git diff --staged --quiet; then
              git commit -m "🔄 Update quota data"
              if git pull --rebase && git push; then
                echo "Push succeeded on attempt $i"
                break
              fi
              echo "Push attempt $i failed, retrying in 10s..."
              sleep 10
            else
              echo "No changes to commit"
              break
            fi
          done

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare Pages site
        run: |
          mkdir -p _site/data
          cp -r web/* _site/
          cp data/quota.json _site/data/
          cp data/last_update.json _site/data/
          if [ -f data/notify_log.json ]; then cp data/notify_log.json _site/data/; fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
