name: Fetch Quota & Notify
# 每 5 分钟自动抓取配额并通知

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [fetch-quota]
  push:
    branches:
      - main
    paths-ignore:
      - 'data/quota.json'
      - 'state.json'
      - 'data/welcomed.json'

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch quota & notify
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_SUBSCRIBERS: ${{ secrets.EMAIL_SUBSCRIBERS }}
        run: python ci_run.py

      - name: Commit updated data
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ state.json notify_log.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "🔄 Update quota data"
            git pull --rebase
            git push
          else
            echo "No changes to commit"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare Pages site
        run: |
          mkdir -p _site/data
          cp -r web/* _site/
          cp data/quota.json _site/data/
          cp data/last_update.json _site/data/
          if [ -f data/notify_log.json ]; then cp data/notify_log.json _site/data/; fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
