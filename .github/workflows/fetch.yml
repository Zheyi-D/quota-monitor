name: Fetch Quota & Notify
# 每 5 分钟自动抓取配额并通知

on:
  workflow_dispatch:
  repository_dispatch:
    types: [fetch-quota]

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests cryptography

      - name: Fetch quota & notify
        env:
          GH_TOKEN: ${{ github.token }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: python ci_run.py

      - name: Commit updated data
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/quota.json data/last_update.json data/run.log data/feishu_subs.json data/feishu_subs_log.json data/notify_template.json data/notify_log.json state.json notify_log.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "🔄 Update quota data" && (git pull --rebase && git push || git push --force-with-lease) || echo "Push failed (non-critical)"
          else
            echo "No changes to commit"
          fi

