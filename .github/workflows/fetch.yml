name: Fetch Quota & Notify
# 每 5 分钟自动抓取配额并通知

on:
  schedule:
    - cron: '*/5 * * * *'   # 每 5 分钟（如不生效请见下方 push 触发器）
  workflow_dispatch:         # 手动触发
  push:                      # push 后备触发器
    branches:
      - main
    paths-ignore:            # 忽略 CI 自己写的文件，避免死循环
      - 'data/quota.json'
      - 'state.json'
      - 'data/welcomed.json'

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch quota & notify
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_SUBSCRIBERS: ${{ secrets.EMAIL_SUBSCRIBERS }}
        run: python ci_run.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ state.json
          if ! git diff --staged --quiet; then
            git commit -m "🔄 Update quota data"
            git push
          else
            echo "No changes to commit"
          fi
