name: Fetch Quota & Notify
# 外部每分钟触发一次；自动任务会在 30 秒间隔内检查两次。

on:
  workflow_dispatch:
    inputs:
      test_wecom:
        description: "仅发送一条企业微信测试通知（不抓取、不更新状态）"
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [fetch-quota]

concurrency:
  group: fetch-quota
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # repository_dispatch records the main SHA when the event is created.
      # A queued run may start after the previous run has already pushed newer
      # release history, so fast-forward before reading any mutable state.
      - name: Sync latest main
        run: |
          git fetch origin main
          git merge --ff-only origin/main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests cryptography

      - name: Fetch quota & notify
        env:
          GH_TOKEN: ${{ github.token }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
          QUOTA_WECOM_SOURCE: ${{ vars.QUOTA_WECOM_SOURCE || 'legacy' }}
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          NOTIFICATIONS_PAUSED: ${{ vars.NOTIFICATIONS_PAUSED || 'false' }}
          WECOM_TEST_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.test_wecom && '1' || '0' }}
          POLL_ITERATIONS: ${{ github.event_name == 'repository_dispatch' && '2' || '1' }}
          POLL_INTERVAL_SECONDS: "30"
          # Re-arm as soon as a row becomes unavailable. A later red -> yellow
          # transition must wake HKID again and may notify the quota group again.
          NOTIFICATION_REARM_SECONDS: "0"
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          HKID_RELEASE_WEBHOOK_URL: ${{ secrets.HKID_RELEASE_WEBHOOK_URL }}
          HKID_RELEASE_WEBHOOK_SECRET: ${{ secrets.HKID_RELEASE_WEBHOOK_SECRET }}
          HKID_RELEASE_WEBHOOK_TIMEOUT_SECONDS: "10"
        run: python ci_run.py

      - name: Validate generated data
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_wecom != true }}
        run: python -m json.tool data/release_log.json > /dev/null

      - name: Commit updated data
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_wecom != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          files=(
            data/quota.json
            data/last_update.json
            data/run.log
            data/release_log.json
            data/feishu_subs.json
            data/feishu_subs_log.json
            data/notify_template.json
            data/notify_log.json
            state.json
            notify_log.json
          )
          for file in "${files[@]}"; do
            if [ -e "$file" ]; then
              git add -- "$file"
            fi
          done
          if ! git diff --staged --quiet; then
            git commit -m "🔄 Update quota data"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No changes to commit"
          fi

      - name: Setup Pages
        if: ${{ vars.ENABLE_PAGES == 'true' && (github.event_name != 'workflow_dispatch' || inputs.test_wecom != true) }}
        uses: actions/configure-pages@v4

      - name: Prepare Pages site
        if: ${{ vars.ENABLE_PAGES == 'true' && (github.event_name != 'workflow_dispatch' || inputs.test_wecom != true) }}
        run: |
          python -m json.tool data/release_log.json > /dev/null
          mkdir -p _site/data
          cp -r web/* _site/
          cp data/quota.json _site/data/
          cp data/last_update.json _site/data/
          if [ -f data/notify_log.json ]; then cp data/notify_log.json _site/data/; fi
          if [ -f data/release_log.json ]; then cp data/release_log.json _site/data/; fi
          if [ -f data/run.log ]; then cp data/run.log _site/data/; fi

      - name: Upload Pages artifact
        if: ${{ vars.ENABLE_PAGES == 'true' && (github.event_name != 'workflow_dispatch' || inputs.test_wecom != true) }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: ${{ vars.ENABLE_PAGES == 'true' && (github.event_name != 'workflow_dispatch' || inputs.test_wecom != true) }}
        uses: actions/deploy-pages@v4
