name: Test Email

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests

      - name: Send test email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_SUBSCRIBERS: ${{ secrets.EMAIL_SUBSCRIBERS }}
        run: |
          python -c "
          import os, json, requests
          key = os.environ.get('RESEND_API_KEY','')
          subs = json.loads(os.environ.get('EMAIL_SUBSCRIBERS','[]'))
          if not key or not subs:
              print('ERROR: secrets not configured')
              exit(1)
          print(f'API key: re_***{key[-4:]}')
          print(f'Subscribers: {subs}')
          for addr in subs:
              resp = requests.post('https://api.resend.com/emails',
                  json={'from': 'Quota Monitor <quota-monitor@resend.dev>', 'to': [addr],
                        'subject': '[quota-monitor] 邮件通道测试',
                        'text': '如果你收到这封邮件，说明 Resend 邮件通知已打通。\n\n当香港入境处放出新的预约配额时，你会自动收到通知。\n\n— quota-monitor'},
                  headers={'Authorization': f'Bearer {key}', 'Content-Type': 'application/json'}, timeout=15)
              print(f'Send to {addr}: {resp.status_code} {resp.text[:300]}')
          print('Done')
          "
