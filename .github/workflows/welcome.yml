name: Welcome New Subscribers

on:
  push:
    branches:
      - main
    paths:
      - 'data/subscribers.json'
  workflow_dispatch:

jobs:
  welcome:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests cryptography

      - name: Send welcome emails
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          python welcome_runner.py

      - name: Commit welcomed.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/welcomed.json
          if ! git diff --staged --quiet; then
            git commit -m "Welcome new subscriber"
            git pull --rebase || (git rebase --abort 2>/dev/null; git checkout --theirs data/welcomed.json; git pull --rebase)
            git push
          else
            echo "No changes to commit"
          fi
