<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>香港入境处预约配额看板</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
</head>
<body>
<div class="container">
  <header>
    <h1>香港入境處預約配額一覽</h1>
    <p class="subtitle">換領身份證 · 各人事登記辦事處</p>
    <div class="meta">
      <span id="updateTime">載入中...</span>
      <span class="legend">
        <span class="dot green"></span> 有名額
        <span class="dot yellow"></span> 少量
        <span class="dot red"></span> 已滿
        <span class="dot gray"></span> 不提供
      </span>
    </div>
    <div class="header-links">
      <a href="https://entry.es2.immd.gov.hk/surgecontrol_extend/ticket/getTicketGet?svcId=57A&language=zh&country=CN" class="btn btn-link" target="_blank" rel="noopener">📋 網上預約申領身份證</a>
      <a href="https://system.es2.immd.gov.hk/smartics2-client/ropbooking/zh-CN/eservices/ropPrefillForm/term?svcId=680&ticketId=680-d7dee587-4de3-4075-a05a-15439620a274" class="btn btn-link" target="_blank" rel="noopener">✏️ 預填表格（已預約人士）</a>
    </div>
  </header>

  <div class="subscribe-box" id="subscribeBox">
    <div class="subscribe-inner">
      <span class="subscribe-label">📧 邮件订阅</span>
      <input type="email" id="subscribeEmail" class="subscribe-input" placeholder="输入邮箱，配额放出时自动通知" maxlength="100">
      <button id="subscribeBtn" class="btn btn-subscribe">订阅</button>
      <button id="unsubscribeBtn" class="btn btn-unsubscribe" title="取消订阅">退订</button>
      <span id="subscribeMsg" class="subscribe-msg hidden"></span>
    </div>
  </div>

  <div class="toolbar">
    <button id="btnToday" class="btn">今天</button>
    <button id="btnPrev" class="btn" disabled>&larr; 較早</button>
    <button id="btnNext" class="btn">較晚 &rarr;</button>
    <span id="dateRange" class="date-range"></span>
  </div>

  <div id="loading" class="loading">載入配額數據中...</div>
  <div id="error" class="error hidden"></div>

  <div class="table-wrapper">
    <table id="quotaTable" class="hidden">
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <footer>
    <p>📱 <a href="https://applink.feishu.cn/client/chat/chatter/add_by_link?link_token=ff3i6631-016b-40cc-989e-e4651ccd353c" target="_blank" rel="noopener">點擊加入飛書群</a> · 資料來源：<a href="https://eservices.es2.immd.gov.hk/es/quota-enquiry-client/?l=zh-CN&appId=579" target="_blank" rel="noopener">香港入境事務處</a> · 每 5 分鐘自動更新 · <a href="https://github.com/Zheyi-D/quota-monitor" target="_blank" rel="noopener">GitHub</a></p>
  </footer>
</div>

<script src="app.js"></script>
</body>
</html>
